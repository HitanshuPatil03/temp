# Alembic configuration.
#
# The database URL is NOT set here. It comes from mrip.config.Settings at runtime
# (migrations/env.py), so migrations connect to exactly the database the
# application connects to and there is no second place to get a DSN wrong.

[alembic]
script_location = migrations
prepend_sys_path = .
# Use the OS path separator for prepend_sys_path rather than Alembic's legacy
# split on spaces/commas/colons, which breaks on Windows drive letters.
path_separator = os

# Revisions are named <rev>_<slug>, so `ls migrations/versions` reads as a history
# instead of a list of hashes.
file_template = %%(rev)s_%%(slug)s

# Migrations are forward-only in deployment (docs/ARCHITECTURE.md §14), but a
# downgrade is still written for every revision so it can be tested in CI.
truncate_slug_length = 48

# Fail rather than silently create a second head. Two heads in a government
# deployment means someone's migration never ran.
revision_environment = false

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a standalone binary and
# exposes no console_scripts entry point for Alembic to import.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
