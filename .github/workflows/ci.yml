name: CI

# The roadmap's phase gates are only real if they run here. Anything asserted in
# a document and not checked in this file is a claim, not a property.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        # Same image and major version as deployment. Testing against a
        # different engine would not exercise the partial unique indexes,
        # composite foreign keys or the audit-log trigger this schema relies on.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mrip
          POSTGRES_PASSWORD: mrip_ci
          POSTGRES_DB: mrip_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mrip -d mrip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy mrip

      - name: Tests
        env:
          MRIP_TEST_DATABASE_URL: postgresql+psycopg://mrip:mrip_ci@127.0.0.1:5432/mrip_test
        run: pytest -q --cov=mrip --cov-report=term-missing

      # Gate (roadmap 0.3): the schema the code expects and the schema the
      # migrations produce must be the same thing. A drifted column is how a
      # fact store starts returning plausible wrong numbers.
      - name: Migrations apply and round-trip
        env:
          MRIP_DATABASE_URL: postgresql+psycopg://mrip:mrip_ci@127.0.0.1:5432/mrip_ci_migrate
        run: |
          python - <<'PY'
          import sqlalchemy as sa
          e = sa.create_engine(
              "postgresql+psycopg://mrip:mrip_ci@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with e.connect() as c:
              c.execute(sa.text("CREATE DATABASE mrip_ci_migrate"))
          PY
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No schema drift between metadata and migrations
        env:
          MRIP_DATABASE_URL: postgresql+psycopg://mrip:mrip_ci@127.0.0.1:5432/mrip_ci_migrate
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id ci_drift
          if grep -qE "op\.(create|drop|alter|add)_" migrations/versions/ci_drift_drift_check.py; then
            echo "::error::Autogenerate found changes — mrip/db/tables.py and the migrations disagree."
            cat migrations/versions/ci_drift_drift_check.py
            exit 1
          fi
          rm migrations/versions/ci_drift_drift_check.py

      # Gate (roadmap 4, enforced from day one): if the model runtime is
      # switched off, every deterministic path must still work. This is the
      # differentiation thesis, checked rather than asserted.
      - name: Deterministic core works with inference disabled
        env:
          MRIP_TEST_DATABASE_URL: postgresql+psycopg://mrip:mrip_ci@127.0.0.1:5432/mrip_test
          MRIP_LLM_ENABLED: "false"
        run: pytest -q

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci || npm install

      # Next 16 emits the global PageProps/LayoutProps helpers the app uses, so
      # typegen has to run before tsc.
      - name: Route types
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Build
        run: npm run build

  stack:
    name: Deployment — images build and the stack serves
    runs-on: ubuntu-latest

    # The jobs above test the source. This one tests the thing a reviewer or an
    # operator actually runs, which is not the same artefact and had drifted
    # badly: the web image could not build (a COPY of a public/ directory that
    # does not exist), the API image crashed on import (the repository root was
    # a parent count that is only true in a checkout), and neither context had
    # a .dockerignore, so the host's node_modules overwrote the one installed
    # for Alpine. Every one of those was invisible to a test suite that imports
    # the package directly, and fatal to `docker compose up`.
    steps:
      - uses: actions/checkout@v5

      # Running the script rather than `docker compose up` on purpose: the
      # script is what the README tells a reviewer to run, so it is the thing
      # that has to keep working. It builds, waits for health, and seeds.
      - name: ./run.sh brings the stack up and seeds it
        run: ./run.sh

      - name: The API answers
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr \
            | grep -q '"status":"ok"'

      # The credentials the script prints have to be the credentials that work.
      # A launcher that confidently prints a password nobody can sign in with
      # is worse than one that prints nothing.
      - name: The printed credentials sign in
        run: |
          code=$(curl -s -o login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"hq.officer","password":"sih-demo-2026-mrip"}')
          echo "login -> $code"
          test "$code" = "200"
          grep -q access_token login.json

      # Seeding runs the real pipeline, so facts with evidence behind them are
      # the proof that ingestion works in the image and not only in the tests.
      - name: The seeded corpus has evidence-backed facts
        run: |
          token=$(sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' login.json)
          curl -fsS -H "Authorization: Bearer $token" \
            'http://127.0.0.1:8000/api/facts?limit=1' > facts.json
          grep -q '"document_id"' facts.json
          grep -q '"cell_ref"' facts.json

      - name: The web server serves
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/

      # A worker that cannot import the package is a stack that ingests nothing,
      # and it fails quietly — every read would still answer.
      - name: The worker and scheduler are alive
        run: |
          docker compose ps
          for service in worker scheduler; do
            running=$(docker compose ps --status running --format '{{.Service}}' \
              | grep -c "^${service}$" || true)
            test "$running" = "1" || {
              echo "::error::${service} is not running"
              docker compose logs "$service"
              exit 1
            }
          done

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=120

      - name: Tear down
        if: always()
        run: docker compose down -v

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # A government deployment is asked what it is running and under what terms.
      # This produces the answer on every commit rather than as an archaeology
      # exercise at handover.
      - name: Inventory Python dependency licences
        working-directory: apps/api
        run: |
          python -m pip install -e "." pip-licenses
          pip-licenses --format=markdown --with-urls \
            --order=license > licences-python.md
          cat licences-python.md
          # Copyleft that would reach MRIP's own source. LGPL is acceptable for
          # an unmodified imported library (psycopg is LGPL-3.0) and is not
          # matched here; AGPL and plain GPL are.
          if grep -Ei "^\| *(GNU )?(Affero|AGPL)" licences-python.md; then
            echo "::error::An AGPL dependency reached the tree. Replace it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: licence-inventory
          path: apps/api/licences-python.md
